<!doctype html>
<html>
  <head>
    <title>Quiz</title>
    <link
      href="https://fonts.googleapis.com/css?family=Noto+Sans+Lycian:regular"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="lesson1.css" />
  </head>
  <body>
    <div class="container" id="homepage">
      <h1 id="title">Quiz Time!</h1>
      <p>Test your knowledge with this fun quiz questions.</p>
      <button id="btn">Start Quiz</button>
    </div>

    <div class="container hidden" id="questions">
      <h1 id="questionTitle">
        What security tool protects the perimiter layer?
      </h1>

      <div class="container" id="scoreContainer">
        <p class="paragraph" id="questionCount">Question 1 out of 5</p>
        <p class="paragraph" id="score">
          <strong> Score: <span id="counter">0</span> </strong>
        </p>
      </div>

      <div class="container" id="answerButton">
        <button class="answers" data-correct="true">
          <span>Firewall</span>
        </button>
        <button class="answers" data-correct="wrong">VLAN</button>
        <button class="answers" data-correct="wrong">Anti-virus</button>
        <button class="answers" data-correct="wrong">MFA</button>
        <button class="answers" data-correct="wrong">Encryption</button>
      </div>
    </div>
    <script src="lesson1.js"></script>
  </body>
</html>
